<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-websites</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6fa; --card: #ffffff; --text: #1b1e27; --muted: #6b7280;
    --border: #e5e7eb; --accent: #4f46e5; --accent-soft: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1015; --card: #171a22; --text: #e8eaf0; --muted: #98a0b3;
      --border: #272b36; --accent: #818cf8; --accent-soft: #1f2340;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -.02em; }
  .sub { margin: 4px 0 24px; color: var(--muted); }
  .search { position: sticky; top: 0; padding: 8px 0 16px; background: var(--bg); z-index: 1; }
  .search input {
    width: 100%; padding: 14px 16px; font-size: 1rem; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  a.card {
    display: flex; align-items: center; gap: 12px; padding: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    color: inherit; text-decoration: none; min-width: 0;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 6px 18px #0000001a; outline: none; }
  .icon {
    flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-size: .7rem; font-weight: 700; text-transform: uppercase;
  }
  .text { min-width: 0; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dir { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { text-align: center; color: var(--muted); padding: 48px 0; grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Websites</h1>
  <p class="sub" id="count">Loading...</p>
  <div class="search">
    <input id="q" type="search" placeholder="Search files..." aria-label="Search files" autocomplete="off">
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
const OWNER = "ranjanayush937", REPO = "my-websites";
const API = "https://api.github.com/repos/" + OWNER + "/" + REPO;
const SITE = "https://" + OWNER + ".github.io/" + REPO + "/";
const grid = document.getElementById("grid");
const count = document.getElementById("count");
const q = document.getElementById("q");
let files = [];

const enc = p => p.split("/").map(encodeURIComponent).join("/");

function state(text) {
  const d = document.createElement("div");
  d.className = "state";
  d.textContent = text;
  grid.replaceChildren(d);
}

function render() {
  const term = q.value.trim().toLowerCase();
  const shown = files.filter(f => f.toLowerCase().includes(term));
  count.textContent = shown.length + " of " + files.length + " files";
  if (!shown.length) return state("No files match your search.");
  grid.replaceChildren(...shown.map(path => {
    const i = path.lastIndexOf("/");
    const name = path.slice(i + 1), dir = i > -1 ? path.slice(0, i) : "/";
    const dot = name.lastIndexOf(".");
    const a = document.createElement("a");
    a.className = "card";
    a.href = SITE + enc(path);
    a.target = "_blank";
    a.rel = "noopener";
    const icon = document.createElement("div");
    icon.className = "icon";
    icon.textContent = dot > 0 ? name.slice(dot + 1, dot + 5) : "file";
    const text = document.createElement("div");
    text.className = "text";
    const n = document.createElement("div");
    n.className = "name"; n.textContent = name; n.title = path;
    const d = document.createElement("div");
    d.className = "dir"; d.textContent = dir;
    text.append(n, d);
    a.append(icon, text);
    return a;
  }));
}

async function init() {
  try {
    const repo = await (await fetch(API)).json();
    if (!repo.default_branch) throw new Error(repo.message || "repo not found");
    const tree = await (await fetch(API + "/git/trees/" + encodeURIComponent(repo.default_branch) + "?recursive=1")).json();
    if (!tree.tree) throw new Error(tree.message || "no files");
    files = tree.tree
      .filter(t => t.type === "blob" && t.path !== "index.html")
      .map(t => t.path);
    render();
  } catch (err) {
    count.textContent = "";
    state("Could not load files: " + err.message);
  }
}
q.addEventListener("input", render);
init();
</script>
</body>
</html>
