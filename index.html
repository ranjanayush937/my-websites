
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website - File Explorer</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: #f3f5f9;
    margin: 0;
    padding: 25px 15px;
    color: #222;
}

.container {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 15px #0001;
}

h1 { margin-top: 0; }

.subtitle { color: #666; }

button {
    background: #0969da;
    color: white;
    border: 0;
    padding: 11px 18px;
    border-radius: 7px;
    cursor: pointer;
    margin: 12px 0;
}

button:hover { background: #0757b5; }

#files {
    list-style: none;
    padding: 0;
}

#files li { margin: 9px 0; }

#files a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: #f7f9fc;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    text-decoration: none;
    color: #0969da;
    overflow-wrap: anywhere;
}

#files a:hover {
    background: #eaf2ff;
    border-color: #0969da;
}

.folder {
    margin-left: auto;
    color: #888;
    font-size: 12px;
    text-align: right;
}

#status {
    padding: 12px;
    background: #f7f9fc;
    border-radius: 7px;
    font-size: 14px;
}

.error { color: #c62828; }

#repoLink {
    color: #0969da;
}
</style>
</head>

<body>

<div class="container">

<h1>📁 My Website</h1>

<p class="subtitle">
Browse and open all HTML pages in my GitHub repository.
</p>

<button onclick="loadFiles()">↻ Refresh File List</button>

<p id="status">Connecting to GitHub...</p>

<ul id="files"></ul>

<p>
<a id="repoLink"
   href="https://github.com/ranjanayush937/my-website"
   target="_blank">
   View GitHub Repository ↗
</a>
</p>

</div>

<script>

const username = "ranjanayush937";
const repo = "my-website";

const apiBase =
    `https://api.github.com/repos/${username}/${repo}`;

const websiteURL =
    `https://${username}.github.io/${repo}/`;

async function loadFiles() {

    const status = document.getElementById("status");
    const container = document.getElementById("files");

    container.innerHTML = "";
    status.className = "";
    status.textContent = "Connecting to GitHub API...";

    try {

        // Step 1: Get repository information
        const repoResponse = await fetch(apiBase);

        if (!repoResponse.ok) {
            if (repoResponse.status === 404) {
                throw new Error(
                    "Repository not found. Check its name and ensure it is public."
                );
            }

            if (repoResponse.status === 403) {
                throw new Error(
                    "GitHub API rate limit or access restriction. Try again later."
                );
            }

            throw new Error(
                `GitHub API error: ${repoResponse.status}`
            );
        }

        const repoData = await repoResponse.json();

        // Step 2: Automatically detect default branch
        const branch = repoData.default_branch;

        status.textContent =
            `Repository connected. Reading branch: ${branch}...`;

        // Step 3: Get all repository files
        const treeURL =
            `${apiBase}/git/trees/${encodeURIComponent(branch)}?recursive=1`;

        const treeResponse = await fetch(treeURL);

        if (!treeResponse.ok) {
            throw new Error(
                `Could not read repository tree: HTTP ${treeResponse.status}`
            );
        }

        const treeData = await treeResponse.json();

        if (treeData.truncated) {
            throw new Error(
                "GitHub returned an incomplete file list because the repository is too large."
            );
        }

        // Step 4: Filter HTML files
        const htmlFiles = treeData.tree.filter(file =>
            file.type === "blob" &&
            file.path.toLowerCase().endsWith(".html") &&
            file.path.toLowerCase() !== "index.html"
        );

        htmlFiles.sort((a, b) =>
            a.path.localeCompare(b.path)
        );

        if (htmlFiles.length === 0) {
            status.textContent = "No additional HTML files found.";
            return;
        }

        // Step 5: Display clickable links
        htmlFiles.forEach(file => {

            const li = document.createElement("li");
            const link = document.createElement("a");

            const icon = document.createElement("span");
            icon.textContent = "📄";

            const name = document.createElement("span");
            name.textContent = file.path;

            const folder = document.createElement("span");
            folder.className = "folder";
            folder.textContent = file.path.includes("/")
                ? file.path.substring(0, file.path.lastIndexOf("/"))
                : "Root";

            // Open the published GitHub Pages file
            link.href = websiteURL +
                file.path.split("/").map(encodeURIComponent).join("/");

            link.target = "_self";

            link.appendChild(icon);
            link.appendChild(name);
            link.appendChild(folder);

            li.appendChild(link);
            container.appendChild(li);

        });

        status.textContent =
            `✅ ${htmlFiles.length} HTML pages found. Click any page to open it.`;

    } catch (error) {

        status.className = "error";
        status.textContent = "❌ " + error.message;

        console.error(error);

    }
}

loadFiles();

</script>

</body>
</html>
