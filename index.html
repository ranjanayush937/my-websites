<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-websites</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid #8884; position: sticky; top: 0; background: Canvas; z-index: 1; }
  h1 { margin: 0 0 8px; font-size: 1.1rem; }
  input { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #8886; border-radius: 6px; }
  main { display: flex; flex-wrap: wrap; }
  #list { flex: 1 1 280px; max-width: 100%; margin: 0; padding: 0; list-style: none; }
  #list li { border-bottom: 1px solid #8883; }
  #list button { width: 100%; text-align: left; padding: 12px 16px; background: none; border: 0; font: inherit; color: inherit; cursor: pointer; word-break: break-all; }
  #list button:hover, #list button.active { background: #8883; }
  #viewer { flex: 3 1 400px; padding: 16px; min-width: 0; }
  #viewer pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
  #viewer img, #viewer iframe { max-width: 100%; }
  #viewer iframe { width: 100%; height: 75vh; border: 1px solid #8884; }
  .muted { opacity: .7; }
</style>
</head>
<body>
<header>
  <h1>ranjanayush937 / my-websites</h1>
  <input id="q" type="search" placeholder="Search files..." aria-label="Search files">
</header>
<main>
  <ul id="list"><li class="muted" style="padding:12px 16px">Loading...</li></ul>
  <section id="viewer"><p class="muted">Select a file to view it.</p></section>
</main>
<script>
const OWNER = "ranjanayush937", REPO = "my-websites";
const API = "https://api.github.com/repos/" + OWNER + "/" + REPO;
const SITE = "https://" + OWNER + ".github.io/" + REPO + "/";
const list = document.getElementById("list");
const viewer = document.getElementById("viewer");
const q = document.getElementById("q");
let files = [], branch = "main";

const enc = p => p.split("/").map(encodeURIComponent).join("/");
const ext = p => (p.split(".").pop() || "").toLowerCase();
const IMG = ["png", "jpg", "jpeg", "gif", "webp", "svg", "ico"];
const PAGE = ["html", "htm"];

function msg(text) {
  const p = document.createElement("p");
  p.className = "muted";
  p.textContent = text;
  return p;
}

function render() {
  const term = q.value.toLowerCase();
  list.replaceChildren();
  files.filter(f => f.path.toLowerCase().includes(term)).forEach(f => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.textContent = f.path;
    b.onclick = () => {
      list.querySelectorAll("button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      openFile(f.path);
    };
    li.appendChild(b);
    list.appendChild(li);
  });
}

async function openFile(path) {
  viewer.replaceChildren(msg("Loading..."));
  const e = ext(path);
  const raw = "https://raw.githubusercontent.com/" + OWNER + "/" + REPO + "/" + encodeURIComponent(branch) + "/" + enc(path);
  const link = document.createElement("p");
  const a = document.createElement("a");
  a.href = SITE + enc(path);
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = "Open in new tab";
  link.appendChild(a);

  if (IMG.includes(e)) {
    const img = document.createElement("img");
    img.src = raw; img.alt = path;
    viewer.replaceChildren(link, img);
  } else if (PAGE.includes(e)) {
    const f = document.createElement("iframe");
    f.src = SITE + enc(path);
    f.sandbox = "allow-scripts allow-same-origin";
    viewer.replaceChildren(link, f);
  } else {
    try {
      const r = await fetch(raw);
      if (!r.ok) throw new Error(r.status);
      const pre = document.createElement("pre");
      pre.textContent = await r.text();
      viewer.replaceChildren(link, pre);
    } catch (err) {
      viewer.replaceChildren(link, msg("Could not load this file."));
    }
  }
}

async function init() {
  try {
    const repo = await (await fetch(API)).json();
    if (!repo.default_branch) throw new Error(repo.message || "repo not found");
    branch = repo.default_branch;
    const tree = await (await fetch(API + "/git/trees/" + encodeURIComponent(branch) + "?recursive=1")).json();
    if (!tree.tree) throw new Error(tree.message || "no files");
    files = tree.tree.filter(t => t.type === "blob");
    render();
  } catch (err) {
    list.replaceChildren();
    const li = document.createElement("li");
    li.style.padding = "12px 16px";
    li.appendChild(msg("Could not load files: " + err.message));
    list.appendChild(li);
  }
}
q.addEventListener("input", render);
init();
</script>
</body>
</html>
